[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
python = "3.15.1"          # required:template
uv = "0.13.1"             # required:template
pipx = "1.18.4"            # required:template
"pipx:makejinja" = "2.9.1" # required:template
age = "1.3.2"
cloudflared = "2026.10.3"
cue = "0.17.1"             # required:template
flux2 = "2.9.6"
gh = "2.102.0"
gum = "0.17.0"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
sd = "1.1.0"               # required:template
sops = "3.13.3"
talhelper = "3.1.17"
talosctl = "1.14.4"
yq = "4.54.1"
zizmor = "1.31.1"

[hooks]
postinstall = "lefthook install"
